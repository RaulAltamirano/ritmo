name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format --check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ritmo_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5436/ritmo_test
      TEST_DATABASE_URL: postgresql://test:test@localhost:5436/ritmo_test
      JWT_SECRET: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      JWT_REFRESH_SECRET: 'fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210'
      JWT_ACCESS_SECRET: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      SESSION_SECRET: 'aaaabbbbccccddddeeeeffff00001111aaaabbbbccccddddeeeeffff00001111'
      DEVICE_HMAC_SECRET: 'bbbbccccddddeeeeffff00001111aaaabbbbccccddddeeeeffff00001111aa'
      API_SECRET: 'ccccddddeeeeffff00001111aaaabbbbccccddddeeeeffff00001111aaaabbbb'
      JWT_ACCESS_EXPIRES_IN: '15m'
      JWT_REFRESH_EXPIRES_IN: '7d'
      BCRYPT_SALT_ROUNDS: '10'
      LOG_LEVEL: error
      LOG_FORMAT: json
      MAX_FAILED_LOGIN_ATTEMPTS: '5'
      LOCKOUT_DURATION_MINUTES: '15'
      RATE_LIMIT_WINDOW_MS: '900000'
      RATE_LIMIT_MAX_REQUESTS: '100'
      SESSION_TIMEOUT_MINUTES: '30'
      MAX_CONCURRENT_SESSIONS: '5'
      MOCK_EMAIL_SERVICE: 'true'
      MOCK_DEVICE_VALIDATION: 'true'
      MOCK_SECURITY_MONITORING: 'true'
      REDIS_URL: 'redis://localhost:6379/1'
      CACHE_TTL: '3600'
      CORS_ORIGINS: 'http://localhost:3000,http://localhost:3001'
      API_PREFIX: /api
      PORT: '0'
      NODE_ENV: test
      CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-

      - name: Run tests with coverage
        run: pnpm test:coverage
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            apps/api/coverage/lcov.info
            apps/web/coverage/lcov.info
          retention-days: 1
          if-no-files-found: warn

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-

      - name: Build all packages
        run: pnpm build
        env:
          NODE_ENV: production
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/*/dist
            packages/*/dist
            apps/*/.output
          retention-days: 7
          if-no-files-found: warn

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run security audit
        run: pnpm audit --audit-level=high
