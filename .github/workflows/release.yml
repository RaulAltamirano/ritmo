name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.15.0'

jobs:
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build for production
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            apps/*/dist
            packages/*/dist
            apps/*/.output
          retention-days: 1

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: prepare-release
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      # ── Deploy Strategy (uncomment ONE when ready) ────────────────────────
      #
      # Option A: Fly.io
      #   Required secret: FLY_API_TOKEN
      # - uses: superfly/flyctl-actions/setup-flyctl@v1
      # - run: flyctl deploy --remote-only --config apps/api/fly.toml
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      #
      # Option B: Railway
      #   Required secret: RAILWAY_DEPLOY_HOOK
      # - name: Trigger Railway deploy
      #   run: curl -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK }}"
      #
      # Option C: Docker + SSH to VPS
      #   Required secrets: GHCR_TOKEN, DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
      #   Build from repo root:
      #     docker build -f apps/api/Dockerfile -t ghcr.io/${{ github.repository }}/api:${{ github.sha }} .
      # ─────────────────────────────────────────────────────────────────────

      - name: Deploy not configured
        run: |
          echo "::error::API deploy is not configured. Choose a strategy in release.yml and add secrets before enabling production deploys."
          exit 1

  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: prepare-release
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Deploy Strategy (uncomment ONE when ready) ────────────────────────
      #
      # Option A: Vercel (recommended for Nuxt)
      #   Required secret: VERCEL_DEPLOY_HOOK
      # - name: Trigger Vercel deploy
      #   run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
      #
      # Option B: Netlify
      #   Required secret: NETLIFY_BUILD_HOOK
      # - name: Trigger Netlify build
      #   run: curl -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
      #
      # Option C: Self-hosted via SSH
      #   Required secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY
      # ─────────────────────────────────────────────────────────────────────

      - name: Deploy not configured
        run: |
          echo "::error::Web deploy is not configured. Choose a strategy in release.yml and add secrets before enabling production deploys."
          exit 1

  notify:
    name: Release Notification
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web]
    if: always()
    steps:
      - name: Summarize release
        run: |
          echo "API: ${{ needs.deploy-api.result }}"
          echo "Web: ${{ needs.deploy-web.result }}"
          if [ "${{ needs.deploy-api.result }}" != "success" ] || [ "${{ needs.deploy-web.result }}" != "success" ]; then
            echo "::error::Release did not deploy successfully (expected until deploy is configured)."
            exit 1
          fi
